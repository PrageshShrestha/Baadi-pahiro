<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Baadi-pahiro</title>
</head>
<body>

<script>
fetch("https://raw.githubusercontent.com/PrageshShrestha/hasslefree/main/hopev.json")
    .then(function(response) {
        return response.json();
    })
    .then(function(config) {
        var base = config.api_base_url;

        if (!base) {
            throw new Error("api_base_url not found");
        }

        base = base.trim();
        base = base.replace(/^https?:\/\//, "");
        base = base.replace(/\/+$/, "");

        window.location.replace("https://" + base);
    })
    .catch(function(error) {
        console.error(error);
        document.body.innerText = "Redirect failed: " + error.message;
    });
</script>

</body>
</html>
